name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: digital_map
          POSTGRES_PASSWORD: digital_map_ci
          POSTGRES_DB: digital_map_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digital_map -d digital_map_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://digital_map:digital_map_ci@127.0.0.1:5432/digital_map_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm prisma:validate
      - run: pnpm prisma:generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm audit:image-spatial-migration
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
